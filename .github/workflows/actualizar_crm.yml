name: Actualizar CRM Honda desde Odoo

on:
  schedule:
    # Cada hora (minuto 0, UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crm-horario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar reportes CRM desde Odoo (solo lectura)
        env:
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
        run: python generar_todo.py

      - name: Publicar cambios
        run: |
          git config user.name "latinbienti-sys"
          git config user.email "latinbienti-sys@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en los reportes del CRM."
          else
            git commit -m "Actualizacion automatica del CRM ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin main
          fi